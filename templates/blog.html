{% extends "main.html" %}

{% block content %}
<p><i><small id="blog-date"></small></i></p>
<script>
    const options = {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'};
    const url = globalThis.location.href;
    const date = new Date(url.split("/").reverse().slice(1, 4).reverse().join("-"));
    document.getElementById("blog-date").innerHTML = date.toLocaleDateString("de-DE", options);
</script>
<hr />
{{ super() }}
{% endblock %}
